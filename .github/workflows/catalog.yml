# Optional. The local catalog works without any of this.
# Enable Pages for the repo (Settings -> Pages -> Source: GitHub Actions) first.
name: Rebuild catalog

on:
  workflow_dispatch:
  schedule:
    # 05:20 UTC daily. Cron on GitHub is best-effort, not punctual.
    - cron: '20 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # CATALOG_TOKEN is optional. The default GITHUB_TOKEN is enough for a
      # public catalog; the build excludes private repositories either way.
      - name: Sync GitHub, capture thumbnails, build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_TOKEN || secrets.GITHUB_TOKEN }}
          CATALOG_OWNER: ${{ github.repository_owner }}
          # Private repositories never reach a deployed catalog. Their names,
          # dates and screenshots stay out of both the build and the commit.
          CATALOG_PUBLIC_ONLY: '1'
        run: |
          npm run catalog:update -- --no-local
          npm run dashboard

      # Keep the generated metadata and any new thumbnails in the repository so
      # a local `npm run dev` is current without needing a token.
      - name: Commit refreshed catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/thumbnails
          git diff --staged --quiet || git commit -m "chore: refresh project catalog"
          git push

      - uses: actions/configure-pages@v5
      # dashboard/ is the same build that opens from a double-click, so the
      # hosted copy and the downloadable one can never drift apart.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
