<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>SIGOVS — Project Catalog</title>
    <meta name="description" content="Visual catalog of every project repository owned by Sigovs." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='6' y='9' width='20' height='13' rx='2' fill='none' stroke='%23c6a76b' stroke-width='1.6'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      document.documentElement.classList.remove('no-js');
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#grid">Skip to projects</a>

    <!-- ─────────────────────────────  HEADER  ───────────────────────────── -->
    <header class="masthead">
      <div class="masthead__inner">
        <div class="wordmark">
          <a class="wordmark__link" href="./" aria-label="SIGOVS Project Catalog — home">
            <span class="wordmark__owner">Sigovs&nbsp;/</span>
            <span class="wordmark__name">Project Catalog</span>
          </a>
          <p class="wordmark__status" id="status">
            <span data-status-count>—</span>
            <span class="dot" aria-hidden="true"></span>
            <span data-status-sync>Loading catalog</span>
          </p>
        </div>

        <nav class="masthead__actions" aria-label="Catalog actions">
          <div class="segmented" role="group" aria-label="Card size">
            <button type="button" class="segmented__btn" data-view="grid" aria-pressed="true" title="Grid view">
              <svg aria-hidden="true" width="15" height="15"><use href="#i-grid" /></svg>
              <span class="sr-only">Grid view</span>
            </button>
            <button type="button" class="segmented__btn" data-view="compact" aria-pressed="false" title="Compact view">
              <svg aria-hidden="true" width="15" height="15"><use href="#i-compact" /></svg>
              <span class="sr-only">Compact view</span>
            </button>
          </div>

          <button type="button" class="icon-btn" data-action="refresh" title="Reload catalog">
            <svg aria-hidden="true" width="15" height="15"><use href="#i-refresh" /></svg>
            <span class="sr-only">Reload catalog</span>
          </button>

          <a class="icon-btn" data-github-profile href="https://github.com/Sigovs" target="_blank" rel="noreferrer" title="GitHub profile">
            <svg aria-hidden="true" width="15" height="15"><use href="#i-github" /></svg>
            <span class="sr-only">Open GitHub profile</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- ────────────────────────────  CONTROLS  ──────────────────────────── -->
    <div class="controls" id="controls">
      <div class="controls__inner">
        <div class="search">
          <svg class="search__icon" aria-hidden="true" width="14" height="14"><use href="#i-search" /></svg>
          <input
            type="search"
            id="search"
            class="search__input"
            placeholder="Search projects…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search projects"
          />
          <kbd class="search__hint" aria-hidden="true">/</kbd>
        </div>

        <div class="filters" role="tablist" aria-label="Category" data-filters></div>

        <div class="controls__right">
          <button type="button" class="toggle" data-action="pinned" aria-pressed="false">
            <svg aria-hidden="true" width="12" height="12"><use href="#i-pin" /></svg>
            Pinned
          </button>

          <label class="select">
            <span class="sr-only">Sort projects</span>
            <select id="sort">
              <option value="updated">Recently updated</option>
              <option value="created">Recently created</option>
              <option value="az">A–Z</option>
              <option value="za">Z–A</option>
            </select>
            <svg class="select__chevron" aria-hidden="true" width="10" height="10"><use href="#i-chevron" /></svg>
          </label>

          <p class="count" data-count aria-live="polite"></p>
        </div>
      </div>
    </div>

    <!-- ──────────────────────────────  GRID  ───────────────────────────── -->
    <main>
      <div class="grid" id="grid" data-view="grid" aria-busy="true"></div>
      <div class="state" data-state hidden></div>
    </main>

    <footer class="colophon">
      <span data-colophon></span>
    </footer>

    <!-- ─────────────────────────────  DRAWER  ──────────────────────────── -->
    <div class="scrim" data-scrim hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      hidden
    ></aside>

    <div class="toast" data-toast role="status" aria-live="polite"></div>

    <!-- ─────────────────────────────  ICONS  ───────────────────────────── -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" stroke-linecap="round" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 16 16" fill="currentColor">
          <rect x="1.5" y="2" width="5.6" height="5" rx="1" /><rect x="8.9" y="2" width="5.6" height="5" rx="1" />
          <rect x="1.5" y="9" width="5.6" height="5" rx="1" /><rect x="8.9" y="9" width="5.6" height="5" rx="1" />
        </symbol>
        <symbol id="i-compact" viewBox="0 0 16 16" fill="currentColor">
          <rect x="1.5" y="2.2" width="3.4" height="3.2" rx=".8" /><rect x="6.3" y="2.2" width="3.4" height="3.2" rx=".8" />
          <rect x="11.1" y="2.2" width="3.4" height="3.2" rx=".8" /><rect x="1.5" y="6.4" width="3.4" height="3.2" rx=".8" />
          <rect x="6.3" y="6.4" width="3.4" height="3.2" rx=".8" /><rect x="11.1" y="6.4" width="3.4" height="3.2" rx=".8" />
          <rect x="1.5" y="10.6" width="3.4" height="3.2" rx=".8" /><rect x="6.3" y="10.6" width="3.4" height="3.2" rx=".8" />
          <rect x="11.1" y="10.6" width="3.4" height="3.2" rx=".8" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.97" /><path d="M13.6 2.3v2.9h-2.9" />
        </symbol>
        <symbol id="i-github" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 .2a8 8 0 0 0-2.53 15.6c.4.07.55-.17.55-.38l-.01-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.88 2.34.67.07-.52.28-.88.51-1.08-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 .2Z" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 16 16" fill="currentColor">
          <path d="M9.9 1.2a1 1 0 0 1 1.4 0l3.5 3.5a1 1 0 0 1-.5 1.7l-1.9.4-2.6 2.6.3 2a1 1 0 0 1-1.7.85L6 10.2l-3.5 3.6a.7.7 0 0 1-1-1l3.6-3.5-2.05-2.4a1 1 0 0 1 .84-1.7l2 .3 2.6-2.6.4-1.9a1 1 0 0 1 .27-.5Z" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 6l4 4 4-4" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 11.5 11.5 4.5M5.6 4.5h5.9v5.9" />
        </symbol>
        <symbol id="i-dots" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="3.4" cy="8" r="1.25" /><circle cx="8" cy="8" r="1.25" /><circle cx="12.6" cy="8" r="1.25" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="5.2" y="5.2" width="8.3" height="8.3" rx="1.6" /><path d="M10.8 5.2V4a1.6 1.6 0 0 0-1.6-1.6H4a1.6 1.6 0 0 0-1.6 1.6v5.2A1.6 1.6 0 0 0 4 10.8h1.2" />
        </symbol>
        <symbol id="i-code" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.6 4.4 2 8l3.6 3.6M10.4 4.4 14 8l-3.6 3.6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1.6a3.2 3.2 0 0 0-3.2 3.2v1.6H4.4A1.4 1.4 0 0 0 3 7.8v5A1.4 1.4 0 0 0 4.4 14h7.2a1.4 1.4 0 0 0 1.4-1.4v-5a1.4 1.4 0 0 0-1.4-1.4h-.4V4.8A3.2 3.2 0 0 0 8 1.6Zm1.8 4.8H6.2V4.8a1.8 1.8 0 1 1 3.6 0v1.6Z" />
        </symbol>
      </defs>
    </svg>
  </body>
</html>
